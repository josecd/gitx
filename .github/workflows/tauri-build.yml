name: 'Build and Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gitx-desktop/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install root dependencies
        run: npm install

      - name: build root typescript files
        run: npm run build

      - name: install frontend dependencies
        working-directory: gitx-desktop
        run: npm install

      - name: build tauri sidecar binary
        working-directory: gitx-desktop
        run: npm run tauri:build-sidecar

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gitx-desktop
          tagName: app-v__VERSION__
          releaseName: 'GitX Desktop v__VERSION__'
          releaseBody: 'Release de GitX Desktop para macOS, Windows y Linux.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
